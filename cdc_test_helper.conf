# CUBRID CDC 추출 대상 데이터베이스
database_name=demodb
user=dba
password=

# CDC 서버 접속 정보
cdc_server_ip=127.0.0.1
cdc_server_port=1523

# 스키마 조회에 사용할 CUBRID 브로커 접속 정보
broker_ip=127.0.0.1
broker_port=33000

# CDC API timeout 설정(-1 또는 0~360초)
connection_timeout=300
extraction_timeout=300

# 한 번의 CDC API 호출로 받을 최대 로그 아이템 수(1~1024)
max_log_item=512

# UPDATE/DELETE 조건절에 전체 컬럼을 포함할지 여부
all_in_cond=false

# 추출할 DB 사용자 목록. 비워 두면 모든 사용자를 대상으로 함
# 여러 사용자는 쉼표로 구분: DBA,APP_USER
extraction_users=

# 추출한 SQL을 다른 DB에 적용할 때만 세 항목을 모두 설정
# 비워 두면 대상 DB 적용 기능은 비활성화됨
target_server_ip=
target_server_port=
target_database_name=

# 출력 설정
print_sql=true
print_log_item=false
print_timer=false
print_transaction=false
ignore_trigger_dml=true
